<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LumenRead</title>
    <meta name="description" content="Pembaca novel offline. Semua data disimpan di browser ini." />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LumenRead" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Terapkan tema sebelum render supaya tidak berkedip.
      try {
        var s = JSON.parse(localStorage.getItem('baca-novel:settings') || '{}');
        // Belum pernah dibuka: tema bawaan Neon (gelap).
        var dark = s.paint ? s.paint.dark : true;
        var bg = s.paint ? s.paint.bg : '#07070d';
        document.documentElement.style.background = bg;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      /* Layar pembuka: menyambung dari layar pembuka Android (latar & logo sama), lalu memudar.
         Gayanya di sini supaya langsung tampil sebelum CSS/JS aplikasi dimuat. */
      #splash {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #07070d; color: #f4f6fa; text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease; animation: splash-auto 0.45s ease 5s forwards;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .s-name { font-size: 38px; font-weight: 800; letter-spacing: 0.01em; }
      #splash .s-name span { color: #2be3ff; text-shadow: 0 0 16px rgba(43, 227, 255, 0.6); }
      #splash img { width: 220px; height: 220px; margin: -24px 0; }
      #splash .s-dev { font-size: 15px; color: #8a90a0; letter-spacing: 0.04em; }
      /* Nama developer: gradasi neon cyan → ungu → merah muda (warna logo) dengan cahaya. */
      #splash .s-dev b {
        font-size: 21px; font-weight: 800; letter-spacing: 0.03em;
        background: linear-gradient(90deg, #2be3ff, #a45cff 55%, #ff3d9a); -webkit-background-clip: text; background-clip: text;
        color: transparent; filter: drop-shadow(0 0 10px rgba(164, 92, 255, 0.55));
      }
      @keyframes splash-auto { to { opacity: 0; visibility: hidden; } }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="s-name">Lumen<span>Read</span></div>
      <img src="icons/icon.svg" alt="" />
      <div class="s-dev">by <b>LinTendo</b></div>
    </div>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>Aplikasi ini butuh JavaScript.</noscript>
  </body>
</html>
