<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Baca Novel</title>
    <meta name="description" content="Pembaca novel offline. Semua data disimpan di browser ini." />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baca Novel" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Terapkan tema sebelum render supaya tidak berkedip.
      try {
        var s = JSON.parse(localStorage.getItem('baca-novel:settings') || '{}');
        document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>Aplikasi ini butuh JavaScript.</noscript>
  </body>
</html>
