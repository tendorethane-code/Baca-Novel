<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LumenRead</title>
    <meta name="description" content="Pembaca novel offline. Semua data disimpan di browser ini." />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LumenRead" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Terapkan tema sebelum render supaya tidak berkedip.
      try {
        var s = JSON.parse(localStorage.getItem('baca-novel:settings') || '{}');
        // Belum pernah dibuka: tema bawaan Neon (gelap).
        var dark = s.paint ? s.paint.dark : true;
        var bg = s.paint ? s.paint.bg : '#07070d';
        // Halaman depan punya gaya sendiri (bawaan Eclipse Neon); layar baca memakai tema warna baca.
        if (!/^#\/?read\//.test(location.hash) && (!s.paint || s.paint.home !== null)) { bg = (s.paint && s.paint.home) || '#07070d'; dark = true; }
        // Layar pembuka ikut gaya halaman depan (Klasik memakai Eclipse Neon).
        if (s.homeStyle === 'royal' || s.homeStyle === 'aurora') document.documentElement.classList.add('splash-' + s.homeStyle);
        document.documentElement.style.background = bg;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
      // Layar pembuka hanya sekali per sesi: tab yang dimuat ulang (mis. ditidurkan "Hemat Memori" browser) tidak menunggu lagi.
      try {
        if (sessionStorage.getItem('lumenread:splash')) document.documentElement.classList.add('no-splash');
        else sessionStorage.setItem('lumenread:splash', '1');
      } catch (e) {}
    </script>
    <style>
      /* Layar pembuka: ikut gaya halaman depan (Eclipse Neon / Royal Eclipse / Aurora), logo & nama di tengah
         (sedikit di atas tengah, titik yang terasa pas di mata), lalu memudar. Gayanya di sini supaya langsung
         tampil sebelum JS aplikasi dimuat. */
      #splash {
        --a: #2be3ff; --a2: #bff6ff; --b: #e8fdff; --sbg: #07070d; --glow: rgba(43, 227, 255, 0.24);
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--sbg); color: #f4f6fa; text-align: center; overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease; animation: splash-auto 0.45s ease 5s forwards;
      }
      .splash-royal #splash { --a: #a77bff; --a2: #e7d9ff; --b: #f0e6ff; --sbg: #0b0716; --glow: rgba(167, 123, 255, 0.28); }
      .splash-aurora #splash { --glow: rgba(43, 227, 255, 0.2); }
      #splash.out { opacity: 0; pointer-events: none; }
      .no-splash #splash { display: none; }
      #splash .s-sky { position: absolute; inset: 0; background: radial-gradient(70% 40% at 50% 41%, var(--glow), transparent 70%),
        radial-gradient(120% 60% at 50% 110%, var(--glow), transparent 60%); }
      .splash-aurora #splash .s-sky { background: radial-gradient(45% 30% at 30% 34%, rgba(43, 227, 255, 0.22), transparent 70%),
        radial-gradient(45% 30% at 72% 46%, rgba(164, 92, 255, 0.24), transparent 70%), radial-gradient(120% 60% at 50% 110%, rgba(164, 92, 255, 0.14), transparent 60%); }
      #splash .s-stars { position: absolute; inset: 0; }
      #splash .s-stars i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: var(--o); box-shadow: 0 0 6px #fff; }
      #splash .s-box { display: flex; flex-direction: column; align-items: center; margin-top: -8vh; }
      #splash .s-lw { width: 150px; height: 150px; display: grid; place-items: center; }
      #splash .s-lw { position: relative; }
      #splash .s-ring { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px; border-radius: 50%; border: 1px solid var(--a); opacity: 0.3; }
      #splash .s-ring.r2 { width: 290px; height: 290px; margin: -145px; opacity: 0.14; }
      #splash .s-ring::before { content: '✦'; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); color: var(--a); font-size: 14px; text-shadow: 0 0 10px var(--a); }
      /* Logo K2 (Kristal Ukir), warna dari --a/--b. */
      /* Logo 168px di wadah 150px: margin -9px supaya tetap tepat di tengah cincin (tanpa ini kelebihan 18px tumpah ke kanan). */
      #splash .s-logo { position: relative; width: 168px; height: 168px; margin: -9px; overflow: visible; }
      #splash .s-name { margin: 64px 0 0; font: 400 46px/1 'Source Serif 4', 'Noto Serif', Georgia, serif; letter-spacing: -0.01em; }
      #splash .s-name em { font-style: italic; padding-right: 0.08em; color: var(--a); text-shadow: 0 0 24px var(--glow); }
      .splash-aurora #splash .s-name em { background: linear-gradient(95deg, #2be3ff, #a45cff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
      #splash .s-orn { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--a); font-size: 12px; }
      #splash .s-orn i { width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--a)); }
      #splash .s-orn i:last-child { transform: scaleX(-1); }
      #splash .s-foot { position: absolute; left: 0; right: 0; bottom: calc(48px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #splash .s-load { width: 150px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #splash .s-load i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--a2), var(--a)); box-shadow: 0 0 10px var(--a);
        animation: splash-load 1.8s ease-out forwards; }
      .splash-aurora #splash .s-load i { background: linear-gradient(90deg, #2be3ff, #a45cff); }
      #splash .s-dev { font-size: 15px; }
      /* Tanda pembuat "by LinTendo" · B Foil: gradasi khas + kilau logam; L & T = SVG berukir (js/logo.js). */
      #splash .sig { display: inline-flex; align-items: baseline; gap: 0.35em; font-family: 'Source Serif 4', 'Noto Serif', Georgia, serif; font-style: normal; white-space: nowrap; }
      #splash .sig .sig-by { font-style: italic; font-size: 0.72em; font-weight: 400; color: var(--sig-by, #8f97ab); }
      #splash .sig .sig-name { display: inline-flex; align-items: baseline; font-weight: 600; font-style: normal; font-size: 1.32em; letter-spacing: 0.03em;
        background: linear-gradient(180deg, rgb(255 255 255 / var(--sig-sheen, .4)) 0%, rgb(255 255 255 / 0) 45%),
          linear-gradient(90deg, var(--f0, #2be3ff) 0%, var(--f1, #dcfbff) 14%, var(--f2, #7f8cff) 34%, var(--f3, #f1e9ff) 50%, var(--f4, #b35cff) 68%, var(--f5, #ff6fb5) 84%, var(--f6, #ffe3f0) 100%);
        -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 8px var(--sig-glow, rgba(164, 92, 255, 0.5))); }
      #splash .sig .sig-name > span { color: transparent; background: none; font-weight: 600; }
      #splash .sig .sig-cap { height: 0.665em; width: auto; overflow: visible; }
      #splash .sig-L { margin-right: 0.01em; }
      #splash .sig-T { margin: 0 0.02em 0 0.04em; }
      #splash .sig .sig-star { font-style: normal; font-size: 0.62em; align-self: center; background: linear-gradient(135deg, var(--f0, #2be3ff), var(--f6, #ffe3f0));
        -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 6px var(--sig-glow, rgba(164, 92, 255, 0.5))); }
      @keyframes splash-load { from { width: 8%; } to { width: 100%; } }
      @keyframes splash-auto { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #splash .s-load i { animation: none; width: 100%; } }
      @media (max-height: 560px) { #splash .s-ring.r2 { display: none; } #splash .s-name { margin-top: 44px; font-size: 38px; } #splash .s-foot { bottom: 20px; } }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>

    <linearGradient id="wls" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".9"/><stop offset=".78" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

      <ellipse cx="60" cy="69" rx="52" ry="10" fill="none" stroke="url(#dks)" stroke-width="4.2" filter="url(#sbs)"/>

    <circle cx="85" cy="36" r="5.5" fill="#fff"/><path d="M85 15C87.52 33.48 87.52 33.48 106 36C87.52 38.52 87.52 38.52 85 57C82.48 38.52 82.48 38.52 64 36C82.48 33.48 82.48 33.48 85 15z" fill="#fff"/></svg></div>
        <div class="s-name">Lumen<em>Read</em></div>

color="var(--f5, #ff6fb5)"/><stop offset="1" stop-color="var(--f6, #ffe3f0)"/></linearGradient><linearGradient id="vsplasht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="var(--sig-sheen, .4)"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M0 0H30L29.6 8.2H28.4Q27.6 1.8 24 1.6H18.2V30.6Q19 32.4 23 32.6V34H7V32.6Q11 32.4 11.8 30.6V1.6H6Q2.4 1.8 1.6 8.2H.4Z" fill="url(#hsplasht)"/><path d="M0 0H30L29.6 8.2H28.4Q27.6 1.8 24 1.6H18.2V30.6Q19 32.4 23 32.6V34H7V32.6Q11 32.4 11.8 30.6V1.6H6Q2.4 1.8 1.6 8.2H.4Z" fill="url(#vsplasht)"/><path d="M15 4V30.6" fill="none" stroke="var(--sig-groove, #04050c)" stroke-width="1" stroke-linecap="round"/><path d="M0 0H30L29.6 8.2H28.4Q27.6 1.8 24 1.6H18.2V30.6Q19 32.4 23 32.6V34H7V32.6Q11 32.4 11.8 30.6V1.6H6Q2.4 1.8 1.6 8.2H.4Z" fill="none" stroke="#fff" stroke-width=".4" opacity="var(--sig-edge, .55)"/></svg><span aria-hidden="true">endo</span></b><em class="sig-star" aria-hidden="true">✦</em></span></div></div>

    <script>
      // Bintang di layar pembuka (posisi tetap, bukan acak tiap buka).
      (function () {
        var box = document.querySelector('#splash .s-stars'), seed = 5;
        if (!box) return;
        function r() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
        for (var i = 0; i < 46; i++) {
          var e = document.createElement('i');
          e.style.cssText = 'left:' + r() * 100 + '%;top:' + r() * 100 + '%;--s:' + (0.6 + r() * 1.8) + 'px;--o:' + (0.2 + r() * 0.7);
          box.appendChild(e);
        }
      })();
    </script>
    <div id="app"></div>
